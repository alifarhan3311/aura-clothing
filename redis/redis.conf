# ── Fade Find – Redis Configuration ────────────────────────────────────────

# Bind to all interfaces so the Node server (host) can reach the container
bind 0.0.0.0

# Default port
port 6379

# Uncomment and set a password if you want AUTH protection
# requirepass your_redis_password

# Persistence – save a snapshot every 60 sec if at least 1 key changed
save 60 1

# Append-only file for durability (optional, comment out if not needed)
appendonly yes
appendfilename "appendonly.aof"

# Max memory (tune to your machine, e.g. 256mb / 512mb)
maxmemory 256mb

# Eviction policy when maxmemory is reached
# allkeys-lru = evict least-recently-used keys first (good for cache/OTP use)
maxmemory-policy allkeys-lru

# Disable dangerous commands in production (optional)
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command CONFIG   ""

# Log level: debug / verbose / notice / warning
loglevel notice
